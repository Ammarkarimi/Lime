<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explanation Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{margin:20px;} iframe{width:100%; height:80vh; border:1px solid #ccc;}</style>
  </head>
  <body class="container">
    <div class="py-3">
      <h2 class="mb-3">Generated Explanation</h2>
      <p>If the HTML does not render, use the download link below.</p>
      <div class="mb-3">
        <a class="btn btn-secondary" href="/">Back</a>
        <a class="btn btn-primary ms-2" href="/results/{{ result_path }}" target="_blank">Open in new tab</a>
        <a class="btn btn-outline-secondary ms-2" href="/results/{{ result_path }}" download>Download HTML</a>
        <button id="toggleSummaryBtn" class="btn btn-info ms-2" onclick="toggleSummary()">Show Summary</button>
      </div>
      <iframe id="result_iframe" src="/results/{{ result_path }}"></iframe>
      <script>
        function toggleSummary() {
          const iframe = document.getElementById('result_iframe');
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const el = doc.getElementById('llm_summary');
            if (!el) {
              alert('No LLM summary present in the explanation.');
              return;
            }
            if (el.style.display === 'none' || el.style.display === '') {
              el.style.display = 'block';
              document.getElementById('toggleSummaryBtn').innerText = 'Hide Summary';
            } else {
              el.style.display = 'none';
              document.getElementById('toggleSummaryBtn').innerText = 'Show Summary';
            }
          } catch (e) {
            alert('Could not access iframe content. Ensure the result is served from the same origin. ' + e);
          }
        }
      </script>
      
    </div>
  </body>
</html>
